<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Theo dõi Open Interest và Volume từ Binance Futures, hiển thị dữ liệu dạng bảng theo ngày">
    <meta name="keywords" content="Binance, Open Interest, Volume, Crypto, Trading, OI, Bitcoin, Ethereum">
    <title>📈 Theo Dõi OI & Volume Binance - Table View</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- CSS tùy chỉnh cho bảng dữ liệu -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" style="font-size: 1.4rem;">
                <i class="bi bi-graph-up-arrow me-2"></i>
                📈 Theo Dõi OI & Volume Binance
            </a>
            
            <button class="btn btn-outline-light" id="refreshBtn">
                <i class="bi bi-arrow-clockwise me-1"></i>
                Làm Mới
            </button>
        </div>
    </nav>

    <!-- Status Bar -->
    <div class="bg-light border-bottom py-2">
        <div class="container">
            <div class="last-update" id="lastUpdateTime">
                <i class="bi bi-clock"></i>
                Đang tải dữ liệu...
            </div>
        </div>
    </div>

    <div class="container-fluid py-4">
        <!-- Time Navigation -->
        <div class="time-nav">
            <div class="d-flex justify-content-center btn-group-wrapper">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-primary" id="hourlyBtn">
                        <i class="bi bi-clock me-1"></i>
                        Theo Giờ (24h)
                    </button>
                    <button type="button" class="btn btn-outline-primary active" id="dailyBtn">
                        <i class="bi bi-calendar3 me-1"></i>
                        Theo Ngày (30 ngày)
                    </button>
                </div>
                
                <!-- Thêm nút chuyển đổi kiểu hiển thị -->
                <div class="btn-group view-toggle ms-2" role="group">
                    <button type="button" class="btn btn-outline-secondary" id="cardViewBtn">
                        <i class="bi bi-grid me-1"></i>
                        Xem dạng thẻ
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="listViewBtn">
                        <i class="bi bi-list me-1"></i>
                        Xem dạng danh sách
                    </button>
                    <button type="button" class="btn btn-outline-secondary active" id="tableViewBtn">
                        <i class="bi bi-table me-1"></i>
                        Xem dạng bảng
                    </button>
                </div>
            </div>
        </div>

        <!-- Data Warning -->
        <div id="dataWarningDiv" class="alert alert-warning d-none">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="dataWarningMessage"></span>
        </div>

        <!-- Loading -->
        <div id="loadingDiv" class="text-center p-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p class="mt-3 text-muted">Đang tải dữ liệu từ Binance...</p>
        </div>

        <!-- Error Message -->
        <div id="errorDiv" class="alert alert-danger d-none">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="errorMessage"></span>
        </div>

        <!-- View Selector -->
        <div class="view-selector">
            <div class="d-flex align-items-center mb-3">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="dataType" id="oiRadio" value="oi" checked>
                    <label class="form-check-label" for="oiRadio">Open Interest</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="dataType" id="volumeRadio" value="volume">
                    <label class="form-check-label" for="volumeRadio">Volume</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="dataType" id="bothRadio" value="both">
                    <label class="form-check-label" for="bothRadio">Cả hai</label>
                </div>
                
                <div class="ms-auto">
                    <select class="form-select" id="timeRangeSelect">
                        <option value="7">7 ngày gần nhất</option>
                        <option value="14">14 ngày gần nhất</option>
                        <option value="30" selected>30 ngày gần nhất</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Thêm bộ điều khiển bảng mới -->
        <div class="table-controls">
            <div class="d-flex align-items-center">
                <label class="me-2">Chọn tiền tệ:</label>
                <select class="form-select form-select-sm" id="symbolFilter">
                    <option value="all" selected>Tất cả</option>
                    <option value="major">Chính (BTC, ETH, BNB)</option>
                    <option value="alt">Altcoins</option>
                </select>
            </div>
            <div class="d-flex align-items-center">
                <div class="btn-group btn-group-sm" role="group">
                    <button type="button" class="btn btn-outline-primary" id="exportCsvBtn">
                        <i class="bi bi-file-earmark-spreadsheet"></i> Xuất CSV
                    </button>
                    <button type="button" class="btn btn-outline-primary" id="printTableBtn">
                        <i class="bi bi-printer"></i> In bảng
                    </button>
                </div>
            </div>
        </div>

        <!-- Content - Table View -->
        <div id="contentDiv">
            <div id="contentContainer" class="container">
                <div id="coinsContainer" class="row"></div>
                <div id="tableViewContainer" class="data-table-container">
                    <table id="dataTable" class="data-table">
                        <thead>
                            <tr id="tableHeader">
                                <th class="symbol-cell">Symbol</th>
                                <!-- Các ngày sẽ được thêm vào đây bằng JavaScript -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Dữ liệu sẽ được thêm vào đây bằng JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light py-3 mt-4">
        <div class="container text-center">
            <p class="mb-1">📈 Hệ thống theo dõi OI & Volume tối ưu</p>
            <small class="text-muted">
                Dữ liệu từ Binance API • Cập nhật mỗi 30 phút
            </small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <!-- Script tùy chỉnh cho bảng dữ liệu -->
    <script src="js/main.js"></script>
    
    <!-- Fix script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Đảm bảo simpleMonitor được khởi tạo
            setTimeout(() => {
                if (!window.simpleMonitor) {
                    console.log('Khởi tạo SimpleOIVolumeMonitor...');
                    window.simpleMonitor = new SimpleOIVolumeMonitor();
                }
            }, 500);
        });
    </script>
</body>
</html>
